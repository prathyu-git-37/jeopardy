<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeopardy Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
    <div id="teamInputArea">
        <h2>Enter Number of Teams</h2>
        <input type="number" id="teamCount" min="2" max="6" value = "3" placeholder="Number of Teams" />
        <button id="startButton">Start Game</button>
    </div>
    <div id="teamNamesArea" class="hidden">
        <h2>Enter Team Names</h2>
        <div id="teamInputs"></div>
        <button id="submitTeamsButton">Submit Team Names</button>
    </div>
    <div id="scoreDisplay" class="hidden"></div>
    <div id="gameBoard" class="hidden"></div>
    <div id="questionArea" class="hidden">
        <h2 id="categoryAndValue"></h2>
        <h1 id="question"></h1>
        <p id="feedback"></p>
        <button id="backButton">Back to Board</button>
    </div>
</div>
<script src="app.js"></script>
</body>
</html>
